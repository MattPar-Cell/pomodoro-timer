<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pomodoro</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --accent: #e05c3a;
      --work-color: #e05c3a;
      --short-color: #3ab8e0;
      --long-color: #3ae07a;
      --mono: 'Share Tech Mono', monospace;
      --sans: 'Barlow', sans-serif;
      --radius: 16px;

      /* Dark glass */
      --bg-a: #0a0a1a;
      --bg-b: #12081e;
      --glass-bg: rgba(255,255,255,0.04);
      --glass-border: rgba(255,255,255,0.10);
      --glass-shine: rgba(255,255,255,0.07);
      --glass-blur: 24px;
      --text: #f0eeff;
      --muted: rgba(255,255,255,0.35);
      --surface: rgba(255,255,255,0.06);
      --shadow: rgba(0,0,0,0.5);
    }

    body.light {
      --bg-a: #c9d6f0;
      --bg-b: #e8d5f5;
      --glass-bg: rgba(255,255,255,0.35);
      --glass-border: rgba(255,255,255,0.65);
      --glass-shine: rgba(255,255,255,0.5);
      --text: #1a1030;
      --muted: rgba(20,10,50,0.45);
      --surface: rgba(255,255,255,0.25);
      --shadow: rgba(100,80,160,0.15);
    }

    body {
      font-family: var(--sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      font-size: 18px;
      user-select: none;
      color: var(--text);
      position: relative;
      overflow-x: hidden;
    }

    /* Animated gradient background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 20%, color-mix(in srgb, var(--accent) 18%, transparent) 0%, transparent 55%),
        radial-gradient(ellipse at 80% 80%, color-mix(in srgb, #7b5ea7 25%, transparent) 0%, transparent 55%),
        radial-gradient(ellipse at 60% 10%, color-mix(in srgb, #3ab8e0 12%, transparent) 0%, transparent 45%),
        linear-gradient(135deg, var(--bg-a), var(--bg-b));
      transition: background 0.6s ease;
      z-index: 0;
    }

    /* Floating orbs */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(circle at 75% 25%, color-mix(in srgb, var(--accent) 12%, transparent) 0%, transparent 30%),
        radial-gradient(circle at 25% 75%, color-mix(in srgb, #5b8dee 10%, transparent) 0%, transparent 30%);
      animation: orb-shift 10s ease-in-out infinite alternate;
      pointer-events: none;
      z-index: 0;
    }

    @keyframes orb-shift {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(30px, -20px) scale(1.08); }
    }

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 1.6rem;
    }

    /* ── Glass card mixin ── */
    .glass {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      border-radius: var(--radius);
      box-shadow:
        0 8px 32px var(--shadow),
        inset 0 1px 0 var(--glass-shine);
    }

    /* ── Header ── */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem 1.4rem;
    }

    .logo {
      font-family: var(--mono);
      font-size: 0.85rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .logo span { color: var(--accent); }
    .session-count {
      font-family: var(--mono);
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.12em;
    }

    /* ── Mode Tabs ── */
    .mode-tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 5px;
    }
    .mode-tab {
      background: transparent;
      border: none;
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.78rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.65rem;
      border-radius: calc(var(--radius) - 6px);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .mode-tab:hover { color: var(--text); background: var(--glass-shine); }
    .mode-tab.active {
      background: color-mix(in srgb, var(--accent) 18%, transparent);
      color: var(--accent);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
    }

    /* ── Shape Switcher ── */
    .shape-switcher {
      display: flex;
      gap: 8px;
      justify-content: center;
      padding: 0.6rem;
    }
    .shape-btn, .scene-btn {
      background: transparent;
      border: 1px solid var(--glass-border);
      color: var(--muted);
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 0.4rem 0.85rem;
      border-radius: 99px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      backdrop-filter: blur(8px);
    }
    .shape-btn:hover, .scene-btn:hover { color: var(--text); border-color: var(--accent); }
    .shape-btn.active, .scene-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 12%, transparent);
      box-shadow: 0 0 12px color-mix(in srgb, var(--accent) 25%, transparent);
    }
    .shape-btn svg, .scene-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 1.5; }
    .scene-glyph { font-size: 13px; line-height: 1; }

    /* ── Ambient scenes (Math / Universe) ── */
    #scene-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.8s ease;
    }
    body.scene-math #scene-canvas,
    body.scene-universe #scene-canvas { opacity: 1; }

    body.scene-universe { --bg-a: #030512; --bg-b: #0b0420; }
    body.scene-universe.light { --bg-a: #dde6fa; --bg-b: #ece1f8; }
    body.scene-math { --bg-a: #070d1c; --bg-b: #0d1026; }
    body.scene-math.light { --bg-a: #e8edfa; --bg-b: #f2ecfa; }

    /* ── Timer wrapper ── */
    .timer-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.4rem;
      padding: 2.5rem 2rem;
    }

    /* ── CIRCLE ── */
    .ring-container {
      position: relative;
      width: 340px;
      height: 340px;
      display: none;
    }
    .shape-circle .ring-container { display: block; }

    svg.ring { width: 100%; height: 100%; transform: rotate(-90deg); filter: drop-shadow(0 0 8px color-mix(in srgb, var(--accent) 40%, transparent)); }
    .ring-bg { fill: none; stroke: var(--glass-border); stroke-width: 2.5; }
    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 3;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 6px var(--accent));
    }

    /* Inner glass circle */
    .ring-inner-glass {
      position: absolute;
      inset: 24px;
      border-radius: 50%;
      background: var(--glass-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border);
      box-shadow:
        inset 0 2px 0 var(--glass-shine),
        0 8px 32px var(--shadow);
    }

    .timer-inner {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }

    /* ── SQUARE ── */
    .square-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      width: 360px;
    }
    .shape-square .square-container { display: flex; }

    .square-box {
      width: 100%;
      border-radius: var(--radius);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
      gap: 0.5rem;
      position: relative;
      overflow: hidden;
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      box-shadow: 0 8px 32px var(--shadow), inset 0 1px 0 var(--glass-shine);
    }
    /* Glowing border on accent color */
    .square-box::before {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: var(--radius);
      border: 1px solid var(--accent);
      opacity: 0.5;
      box-shadow: 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent), inset 0 0 20px color-mix(in srgb, var(--accent) 10%, transparent);
      pointer-events: none;
      transition: opacity 0.3s;
    }
    .square-fill {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, color-mix(in srgb, var(--accent) 15%, transparent), transparent);
      transition: height 0.5s linear;
    }
    .square-box .time-display,
    .square-box .mode-label { position: relative; z-index: 1; }

    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: var(--glass-border);
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 2px;
      transition: width 0.5s linear, background 0.3s;
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── MINIMAL ── */
    .minimal-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 0.6rem;
      padding: 3rem 3rem;
      width: 100%;
    }
    .shape-minimal .minimal-container { display: flex; }
    .minimal-container .time-display { font-size: 9rem; text-shadow: 0 0 40px color-mix(in srgb, var(--accent) 40%, transparent); }
    .minimal-progress {
      width: 220px;
      height: 2px;
      background: var(--glass-border);
      border-radius: 1px;
      margin-top: 0.4rem;
    }
    .minimal-progress-fill {
      height: 100%;
      background: var(--accent);
      border-radius: 1px;
      transition: width 0.5s linear, background 0.3s;
      box-shadow: 0 0 8px var(--accent);
    }

    /* ── Shared time display ── */
    .time-display {
      font-family: var(--mono);
      font-size: 6.5rem;
      font-weight: 400;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1;
      transition: color 0.3s ease;
      text-shadow: 0 2px 20px color-mix(in srgb, var(--accent) 30%, transparent);
    }
    .time-display.pulse { animation: pulse 0.3s ease; }
    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.04); }
      100% { transform: scale(1); }
    }
    .mode-label {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      color: var(--muted);
      text-transform: uppercase;
    }

    /* ── Controls ── */
    .controls { display: flex; align-items: center; justify-content: center; gap: 1rem; }
    .btn {
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      color: var(--muted);
      cursor: pointer;
      border-radius: var(--radius);
      transition: all 0.2s ease;
      font-family: var(--mono);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 12px var(--shadow), inset 0 1px 0 var(--glass-shine);
    }
    .btn:hover {
      border-color: var(--accent);
      color: var(--text);
      box-shadow: 0 4px 20px color-mix(in srgb, var(--accent) 25%, transparent), inset 0 1px 0 var(--glass-shine);
    }
    .btn:active { transform: scale(0.96); }

    .btn-icon { width: 60px; height: 60px; display: grid; place-items: center; font-size: 1.3rem; border-radius: 50%; }
    .btn-main {
      width: 180px; height: 64px;
      font-size: 0.8rem; letter-spacing: 0.22em; text-transform: uppercase;
      border-color: var(--accent);
      color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, transparent);
    }
    .btn-main:hover { background: color-mix(in srgb, var(--accent) 22%, transparent); color: var(--text); }
    .btn-main.running { animation: border-pulse 2s ease infinite; }
    @keyframes border-pulse {
      0%, 100% { box-shadow: 0 4px 12px var(--shadow), 0 0 0 0 transparent, inset 0 1px 0 var(--glass-shine); }
      50%       { box-shadow: 0 4px 12px var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 20%, transparent), inset 0 1px 0 var(--glass-shine); }
    }

    /* ── Dots ── */
    .session-dots { display: flex; gap: 8px; justify-content: center; }
    .dot { width: 9px; height: 9px; border-radius: 2px; background: var(--glass-border); transition: all 0.3s ease; }
    .dot.done { background: var(--work-color); box-shadow: 0 0 6px var(--work-color); }
    .dot.current { background: var(--accent); box-shadow: 0 0 8px var(--accent); animation: dot-blink 1s ease infinite; }
    @keyframes dot-blink { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ── Stats ── */
    .status-bar {
      display: flex;
      justify-content: space-around;
      padding: 1.2rem 2rem;
    }
    .status-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .status-val { font-family: var(--mono); font-size: 1.6rem; color: var(--text); }
    .status-key { font-family: var(--mono); font-size: 0.6rem; letter-spacing: 0.18em; color: var(--muted); text-transform: uppercase; }

    /* ── Settings ── */
    .settings-section { overflow: hidden; }
    .settings-toggle {
      display: flex; align-items: center; justify-content: space-between;
      padding: 1rem 1.4rem;
      cursor: pointer; color: var(--muted);
      font-family: var(--mono); font-size: 0.75rem;
      letter-spacing: 0.2em; text-transform: uppercase; transition: color 0.15s;
    }
    .settings-toggle:hover { color: var(--text); }
    .settings-chevron { transition: transform 0.25s ease; }
    .settings-chevron.open { transform: rotate(180deg); }
    .settings-panel { display: none; flex-direction: column; gap: 1rem; padding: 0 1.4rem 1.4rem; }
    .settings-panel.open { display: flex; }
    .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 1rem; }
    .setting-label { font-family: var(--mono); font-size: 0.75rem; letter-spacing: 0.1em; color: var(--muted); text-transform: uppercase; flex: 1; }
    .setting-input { display: flex; align-items: center; gap: 0.5rem; }
    .setting-input button {
      background: var(--glass-bg); border: 1px solid var(--glass-border); color: var(--muted);
      width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1rem;
      transition: all 0.15s; backdrop-filter: blur(8px);
    }
    .setting-input button:hover { border-color: var(--accent); color: var(--text); }
    .setting-val { font-family: var(--mono); font-size: 0.9rem; color: var(--text); min-width: 32px; text-align: center; }
    .setting-toggle-row { display: flex; align-items: center; justify-content: space-between; }
    .toggle-switch { position: relative; width: 40px; height: 22px; }
    .toggle-switch input { display: none; }
    .toggle-track {
      position: absolute; inset: 0;
      background: var(--glass-border); border-radius: 11px; cursor: pointer; transition: background 0.2s;
      border: 1px solid var(--glass-border);
    }
    .toggle-track::after {
      content: ''; position: absolute; top: 3px; left: 3px;
      width: 14px; height: 14px; border-radius: 50%;
      background: var(--muted); transition: all 0.2s;
    }
    .toggle-switch input:checked + .toggle-track { background: color-mix(in srgb, var(--accent) 35%, transparent); border-color: var(--accent); }
    .toggle-switch input:checked + .toggle-track::after { transform: translateX(18px); background: var(--accent); box-shadow: 0 0 6px var(--accent); }

    /* ── Notify ── */
    .notify {
      position: fixed; top: 1.5rem; left: 50%;
      transform: translateX(-50%) translateY(-120px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: var(--text); font-family: var(--mono); font-size: 0.72rem;
      letter-spacing: 0.12em; padding: 0.7rem 1.4rem;
      border-radius: 99px;
      box-shadow: 0 8px 32px var(--shadow), 0 0 20px color-mix(in srgb, var(--accent) 20%, transparent);
      transition: transform 0.35s cubic-bezier(0.34,1.56,0.64,1);
      z-index: 100; white-space: nowrap;
    }
    .notify.show { transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body class="shape-circle">
  <canvas id="scene-canvas"></canvas>
  <div class="app">

    <!-- Header -->
    <header class="glass">
      <div class="logo">POMO<span>//</span>DORO</div>
      <div style="display:flex;align-items:center;gap:1rem">
        <button class="btn btn-icon" id="btn-theme" title="Toggle light/dark" style="width:40px;height:40px;font-size:1rem;border-radius:50%">☀</button>
        <div class="session-count" id="session-count">SESSION 1 / 4</div>
      </div>
    </header>

    <!-- Mode Tabs -->
    <div class="mode-tabs glass">
      <button class="mode-tab active" data-mode="work">Work</button>
      <button class="mode-tab" data-mode="short">Short Break</button>
      <button class="mode-tab" data-mode="long">Long Break</button>
    </div>

    <!-- Shape Switcher -->
    <div class="shape-switcher glass">
      <button class="shape-btn active" data-shape="circle">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/></svg>Circle
      </button>
      <button class="shape-btn" data-shape="square">
        <svg viewBox="0 0 16 16"><rect x="2" y="2" width="12" height="12" rx="2"/></svg>Square
      </button>
      <button class="shape-btn" data-shape="minimal">
        <svg viewBox="0 0 16 16"><line x1="2" y1="6" x2="14" y2="6"/><line x1="2" y1="10" x2="14" y2="10"/></svg>Minimal
      </button>
    </div>

    <!-- Scene Switcher -->
    <div class="shape-switcher glass">
      <button class="scene-btn active" data-scene="off">
        <svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="6"/><line x1="4" y1="12" x2="12" y2="4"/></svg>No scene
      </button>
      <button class="scene-btn" data-scene="math">
        <span class="scene-glyph">π</span>Math
      </button>
      <button class="scene-btn" data-scene="universe">
        <span class="scene-glyph">✦</span>Universe
      </button>
    </div>

    <!-- Timer -->
    <div class="timer-wrapper glass">

      <!-- CIRCLE -->
      <div class="ring-container">
        <svg class="ring" viewBox="0 0 260 260">
          <circle class="ring-bg" cx="130" cy="130" r="120"/>
          <circle class="ring-progress" id="ring-progress" cx="130" cy="130" r="120"/>
        </svg>
        <div class="ring-inner-glass"></div>
        <div class="timer-inner">
          <div class="time-display" id="time-display-circle">25:00</div>
          <div class="mode-label" id="mode-label-circle">FOCUS</div>
        </div>
      </div>

      <!-- SQUARE -->
      <div class="square-container">
        <div class="square-box">
          <div class="square-fill" id="square-fill"></div>
          <div class="time-display" id="time-display-square">25:00</div>
          <div class="mode-label" id="mode-label-square">FOCUS</div>
        </div>
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-bar-fill"></div>
        </div>
      </div>

      <!-- MINIMAL -->
      <div class="minimal-container">
        <div class="time-display" id="time-display-minimal">25:00</div>
        <div class="mode-label" id="mode-label-minimal">FOCUS</div>
        <div class="minimal-progress">
          <div class="minimal-progress-fill" id="minimal-progress-fill"></div>
        </div>
      </div>

      <!-- Controls -->
      <div class="controls">
        <button class="btn btn-icon" id="btn-reset" title="Reset">↺</button>
        <button class="btn btn-main" id="btn-start">START</button>
        <button class="btn btn-icon" id="btn-skip" title="Skip">↝</button>
      </div>

      <!-- Dots -->
      <div class="session-dots" id="session-dots"></div>
    </div>

    <!-- Stats -->
    <div class="status-bar glass">
      <div class="status-item">
        <div class="status-val" id="stat-completed">0</div>
        <div class="status-key">Completed</div>
      </div>
      <div class="status-item">
        <div class="status-val" id="stat-focus">0m</div>
        <div class="status-key">Focus time</div>
      </div>
      <div class="status-item">
        <div class="status-val" id="stat-streak">0</div>
        <div class="status-key">Streak</div>
      </div>
    </div>

    <!-- Settings -->
    <div class="settings-section glass">
      <div class="settings-toggle" id="settings-toggle">
        <span>Settings</span>
        <span class="settings-chevron" id="settings-chevron">▾</span>
      </div>
      <div class="settings-panel" id="settings-panel">
        <div class="setting-row">
          <span class="setting-label">Work</span>
          <div class="setting-input">
            <button id="work-dec">−</button>
            <span class="setting-val" id="work-val">25</span>
            <button id="work-inc">+</button>
          </div>
          <span class="setting-label" style="text-align:right">min</span>
        </div>
        <div class="setting-row">
          <span class="setting-label">Short Break</span>
          <div class="setting-input">
            <button id="short-dec">−</button>
            <span class="setting-val" id="short-val">5</span>
            <button id="short-inc">+</button>
          </div>
          <span class="setting-label" style="text-align:right">min</span>
        </div>
        <div class="setting-row">
          <span class="setting-label">Long Break</span>
          <div class="setting-input">
            <button id="long-dec">−</button>
            <span class="setting-val" id="long-val">15</span>
            <button id="long-inc">+</button>
          </div>
          <span class="setting-label" style="text-align:right">min</span>
        </div>
        <div class="setting-row">
          <span class="setting-label">Sessions / long break</span>
          <div class="setting-input">
            <button id="sessions-dec">−</button>
            <span class="setting-val" id="sessions-val">4</span>
            <button id="sessions-inc">+</button>
          </div>
          <span class="setting-label" style="text-align:right"></span>
        </div>
        <div class="setting-toggle-row">
          <span class="setting-label">Auto-start next</span>
          <label class="toggle-switch"><input type="checkbox" id="toggle-autostart"/><div class="toggle-track"></div></label>
        </div>
        <div class="setting-toggle-row">
          <span class="setting-label">Sound alerts</span>
          <label class="toggle-switch"><input type="checkbox" id="toggle-sound" checked/><div class="toggle-track"></div></label>
        </div>
      </div>
    </div>

  </div>

  <div class="notify" id="notify"></div>

  <script>
    const state = {
      mode: 'work', running: false,
      secondsLeft: 25*60, totalSeconds: 25*60,
      pomodoroCount: 0, focusMinutes: 0, streak: 0, interval: null,
      shape: localStorage.getItem('shape') || 'circle',
      settings: { work:25, short:5, long:15, sessionsPerLong:4, autostart:false, sound:true }
    };

    const $start = document.getElementById('btn-start');
    const $reset = document.getElementById('btn-reset');
    const $skip  = document.getElementById('btn-skip');
    const $dots  = document.getElementById('session-dots');
    const $scount= document.getElementById('session-count');
    const $notify= document.getElementById('notify');
    const $ring  = document.getElementById('ring-progress');

    const R = 120, CIRC = 2*Math.PI*R;
    $ring.style.strokeDasharray = CIRC;

    const COLORS = { work:'#e05c3a', short:'#3ab8e0', long:'#3ae07a' };
    const LABELS = { work:'FOCUS', short:'SHORT BREAK', long:'LONG BREAK' };

    // ── Shape ──
    function applyShape(shape) {
      state.shape = shape;
      document.body.className = document.body.className.replace(/shape-\w+/g,'').trim() + ' shape-' + shape;
      if (document.body.classList.contains('light')) document.body.classList.add('light');
      document.querySelectorAll('.shape-btn').forEach(b => b.classList.toggle('active', b.dataset.shape === shape));
      localStorage.setItem('shape', shape);
    }
    document.querySelectorAll('.shape-btn').forEach(b => b.addEventListener('click', () => applyShape(b.dataset.shape)));

    // ── Theme ──
    const $btnTheme = document.getElementById('btn-theme');
    let isLight = localStorage.getItem('theme') === 'light';
    function applyTheme() {
      document.body.classList.toggle('light', isLight);
      $btnTheme.textContent = isLight ? '🌙' : '☀';
      localStorage.setItem('theme', isLight ? 'light' : 'dark');
    }
    $btnTheme.addEventListener('click', () => { isLight = !isLight; applyTheme(); });

    // ── Audio ──
    function beep(type) {
      if (!state.settings.sound) return;
      try {
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const osc = ctx.createOscillator(), gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type==='end') {
          osc.frequency.setValueAtTime(880,ctx.currentTime);
          osc.frequency.setValueAtTime(660,ctx.currentTime+0.1);
          osc.frequency.setValueAtTime(440,ctx.currentTime+0.2);
          gain.gain.setValueAtTime(0.3,ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.5);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.5);
        } else {
          osc.frequency.setValueAtTime(660,ctx.currentTime);
          gain.gain.setValueAtTime(0.2,ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+0.12);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime+0.12);
        }
      } catch(e){}
    }

    let notifyTimer;
    function showNotify(msg) {
      $notify.textContent = msg;
      $notify.classList.add('show');
      clearTimeout(notifyTimer);
      notifyTimer = setTimeout(() => $notify.classList.remove('show'), 3000);
    }

    // ── Render ──
    function render() {
      const s = state.secondsLeft;
      const m = Math.floor(s/60).toString().padStart(2,'0');
      const sec = (s%60).toString().padStart(2,'0');
      const timeStr = `${m}:${sec}`;
      const progress = s / state.totalSeconds;
      const col = COLORS[state.mode];

      document.documentElement.style.setProperty('--accent', col);

      ['circle','square','minimal'].forEach(sh => {
        const td = document.getElementById(`time-display-${sh}`);
        const ml = document.getElementById(`mode-label-${sh}`);
        if (td) td.textContent = timeStr;
        if (ml) ml.textContent = LABELS[state.mode];
      });

      // Circle
      $ring.style.strokeDashoffset = CIRC*(1-progress);
      $ring.style.stroke = col;

      // Square
      const sf = document.getElementById('square-fill');
      if (sf) sf.style.height = ((1-progress)*100)+'%';
      const pbf = document.getElementById('progress-bar-fill');
      if (pbf) { pbf.style.width = (progress*100)+'%'; pbf.style.background = col; pbf.style.boxShadow = `0 0 8px ${col}`; }

      // Minimal
      const mpf = document.getElementById('minimal-progress-fill');
      if (mpf) { mpf.style.width = (progress*100)+'%'; mpf.style.background = col; }

      $start.textContent = state.running ? 'PAUSE' : 'START';
      $start.classList.toggle('running', state.running);

      const { sessionsPerLong } = state.settings;
      $scount.textContent = `SESSION ${(state.pomodoroCount % sessionsPerLong)+1} / ${sessionsPerLong}`;

      $dots.innerHTML = '';
      for (let i=0; i<sessionsPerLong; i++) {
        const d = document.createElement('div');
        d.className = 'dot';
        if (i < state.pomodoroCount % sessionsPerLong) d.classList.add('done');
        else if (i === state.pomodoroCount % sessionsPerLong && state.mode==='work') d.classList.add('current');
        $dots.appendChild(d);
      }

      document.getElementById('stat-completed').textContent = state.pomodoroCount;
      document.getElementById('stat-focus').textContent = state.focusMinutes+'m';
      document.getElementById('stat-streak').textContent = state.streak;
      document.title = `${timeStr} — Pomodoro`;
    }

    function tick() {
      if (state.secondsLeft<=0) { onTimerEnd(); return; }
      state.secondsLeft--; render();
    }

    function onTimerEnd() {
      clearInterval(state.interval); state.running=false; beep('end');
      if (state.mode==='work') {
        state.pomodoroCount++; state.focusMinutes+=state.settings.work; state.streak++;
        const isLong = state.pomodoroCount % state.settings.sessionsPerLong === 0;
        showNotify(isLong ? '🎉 Long break time!' : '☕ Short break time!');
        if (state.settings.autostart) setTimeout(()=>setMode(isLong?'long':'short',true),800);
        else setMode(isLong?'long':'short',false);
      } else {
        showNotify('💪 Back to work!');
        if (state.settings.autostart) setTimeout(()=>setMode('work',true),800);
        else setMode('work',false);
      }
    }

    function startTimer() {
      if (state.running) return;
      state.running=true; state.interval=setInterval(tick,1000); beep('tick'); render();
    }
    function pauseTimer() { clearInterval(state.interval); state.running=false; render(); }
    function resetTimer() { clearInterval(state.interval); state.running=false; state.secondsLeft=state.totalSeconds; render(); }

    function setMode(mode, autostart=false) {
      clearInterval(state.interval); state.running=false; state.mode=mode;
      const mins = mode==='work'?state.settings.work:mode==='short'?state.settings.short:state.settings.long;
      state.totalSeconds=mins*60; state.secondsLeft=state.totalSeconds;
      document.querySelectorAll('.mode-tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===mode));
      render();
      ['circle','square','minimal'].forEach(sh=>{
        const td=document.getElementById(`time-display-${sh}`);
        if(td){td.classList.add('pulse');setTimeout(()=>td.classList.remove('pulse'),300);}
      });
      if (autostart) startTimer();
    }

    $start.addEventListener('click', ()=>{ if(state.running) pauseTimer(); else startTimer(); });
    $reset.addEventListener('click', resetTimer);
    $skip.addEventListener('click', ()=>{ clearInterval(state.interval); state.running=false; onTimerEnd(); });
    document.querySelectorAll('.mode-tab').forEach(t=>t.addEventListener('click',()=>setMode(t.dataset.mode)));

    document.getElementById('settings-toggle').addEventListener('click', ()=>{
      document.getElementById('settings-panel').classList.toggle('open');
      document.getElementById('settings-chevron').classList.toggle('open');
    });

    function makeAdjuster(id,key,min,max,displayId,onUpdate){
      const display=document.getElementById(displayId);
      document.getElementById(`${id}-inc`).addEventListener('click',()=>{
        if(state.settings[key]<max){state.settings[key]++;display.textContent=state.settings[key];onUpdate();}
      });
      document.getElementById(`${id}-dec`).addEventListener('click',()=>{
        if(state.settings[key]>min){state.settings[key]--;display.textContent=state.settings[key];onUpdate();}
      });
    }

    makeAdjuster('work','work',1,60,'work-val',()=>{if(state.mode==='work'){state.totalSeconds=state.settings.work*60;state.secondsLeft=state.totalSeconds;}render();});
    makeAdjuster('short','short',1,30,'short-val',()=>{if(state.mode==='short'){state.totalSeconds=state.settings.short*60;state.secondsLeft=state.totalSeconds;}render();});
    makeAdjuster('long','long',1,60,'long-val',()=>{if(state.mode==='long'){state.totalSeconds=state.settings.long*60;state.secondsLeft=state.totalSeconds;}render();});
    makeAdjuster('sessions','sessionsPerLong',1,8,'sessions-val',()=>render());

    document.getElementById('toggle-autostart').addEventListener('change',e=>state.settings.autostart=e.target.checked);
    document.getElementById('toggle-sound').addEventListener('change',e=>state.settings.sound=e.target.checked);

    document.addEventListener('keydown',e=>{
      if(e.code==='Space'&&e.target===document.body){e.preventDefault();if(state.running)pauseTimer();else startTimer();}
      if(e.code==='KeyR'&&!e.ctrlKey) resetTimer();
    });

    // ══════════ AMBIENT SCENES ══════════
    // Two full-screen canvas simulations rendered behind the glass UI:
    //  • math     — graph grid, unit-circle→sine-wave machine, golden-angle
    //               phyllotaxis, drifting symbols and famous identities
    //  • universe — parallax starfield, nebulae, spiral galaxy with
    //               differential rotation, ringed planet, meteors
    const $sceneCanvas = document.getElementById('scene-canvas');
    const sc = $sceneCanvas.getContext('2d');
    let sceneName = localStorage.getItem('scene') || 'off';
    let sceneRAF = null, lastFrameT = 0, simT = 0;
    let SW = 0, SH = 0;

    function sceneResize() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);
      SW = window.innerWidth; SH = window.innerHeight;
      $sceneCanvas.width = SW * dpr;
      $sceneCanvas.height = SH * dpr;
      sc.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildScene();
    }

    // ── Math scene state ──
    const MATH_GLYPHS = ['π','φ','e','∞','∑','∫','√','Δ','θ','λ','∂','Ω','ζ','μ','≈','≠','∇','ε','ψ','ℵ'];
    const MATH_EQS = [
      'e^iπ + 1 = 0',
      'a² + b² = c²',
      'φ = (1+√5)/2 ≈ 1.618',
      '∑ 1/n² = π²/6',
      'E = mc²',
      '∫ eˣ dx = eˣ + C',
      '1  1  2  3  5  8  13  21  34',
      'P(A|B) = P(B|A)·P(A) / P(B)',
      'x = (−b ± √(b²−4ac)) / 2a',
      'sin²θ + cos²θ = 1',
      "f'(x) = lim  (f(x+h) − f(x)) / h",
      '∇·E = ρ/ε₀'
    ];
    let mGlyphs = [], mEqs = [], mEqTimer = 0;

    // ── Universe scene state ──
    let uStars = [], uNebulae = [], uGalaxy = [], uMeteors = [], uMeteorTimer = 0;

    function buildScene() {
      if (sceneName === 'math') {
        mGlyphs = [];
        for (let i = 0; i < 22; i++) mGlyphs.push({
          x: Math.random() * SW, y: Math.random() * SH,
          s: 14 + Math.random() * 26,
          g: MATH_GLYPHS[i % MATH_GLYPHS.length],
          vy: 6 + Math.random() * 10,
          ph: Math.random() * Math.PI * 2,
          rot: (Math.random() - 0.5) * 0.6
        });
        mEqs = []; mEqTimer = 1.5;
      } else if (sceneName === 'universe') {
        uStars = [];
        // three parallax layers: [count, base size, drift px/s]
        [[170, 0.6, 2], [90, 1.0, 4], [40, 1.6, 7]].forEach((L, li) => {
          for (let i = 0; i < L[0]; i++) uStars.push({
            x: Math.random() * SW, y: Math.random() * SH,
            r: L[1] * (0.5 + Math.random()),
            spd: L[2],
            ph: Math.random() * Math.PI * 2,
            fr: 0.5 + Math.random() * 2,
            li
          });
        });
        const hues = [265, 200, 320, 225, 180];
        uNebulae = [];
        for (let i = 0; i < 5; i++) uNebulae.push({
          x: Math.random() * SW, y: Math.random() * SH,
          r: 180 + Math.random() * 260,
          hue: hues[i],
          dx: (Math.random() - 0.5) * 4, dy: (Math.random() - 0.5) * 3,
          ph: Math.random() * 6
        });
        uGalaxy = [];
        const arms = 3;
        for (let a = 0; a < arms; a++) for (let i = 0; i < 110; i++) {
          const f = i / 110;
          uGalaxy.push({
            r: (10 + f * 130) * (0.92 + Math.random() * 0.16),
            a0: a * (Math.PI * 2 / arms) + f * 2.6 + (Math.random() - 0.5) * 0.35,
            s: 0.4 + Math.random() * 1.1,
            al: (1 - f) * 0.5 + 0.1,
            warm: Math.random() < 0.25
          });
        }
        uMeteors = []; uMeteorTimer = 3;
      }
    }

    function drawMath(dt) {
      sc.clearRect(0, 0, SW, SH);
      const light = document.body.classList.contains('light');
      const ink = light ? '43,32,94' : '168,196,255';
      const accent = COLORS[state.mode];

      // drifting graph-paper grid
      const gs = 48, off = (simT * 4) % gs;
      sc.strokeStyle = `rgba(${ink},${light ? 0.10 : 0.055})`;
      sc.lineWidth = 1;
      sc.beginPath();
      for (let x = -off + gs; x < SW; x += gs) { sc.moveTo(x, 0); sc.lineTo(x, SH); }
      for (let y = -off + gs; y < SH; y += gs) { sc.moveTo(0, y); sc.lineTo(SW, y); }
      sc.stroke();

      // golden-angle phyllotaxis (the sunflower pattern), slowly rotating
      const px = SW - 150, py = 150, GA = Math.PI * (3 - Math.sqrt(5));
      const rot = simT * 0.12;
      for (let i = 0; i < 240; i++) {
        const r = 5.2 * Math.sqrt(i);
        if (r > 135) break;
        const a = i * GA + rot;
        const x = px + Math.cos(a) * r, y = py + Math.sin(a) * r;
        const tw = 0.5 + 0.5 * Math.sin(simT * 2 - r * 0.08);
        sc.fillStyle = `rgba(${ink},${(light ? 0.5 : 0.42) * (0.25 + 0.5 * tw) * (1 - r / 150)})`;
        sc.beginPath(); sc.arc(x, y, 0.9 + r * 0.013, 0, Math.PI * 2); sc.fill();
      }

      // unit circle generating a sine wave along the bottom
      const cx = 110, cy = SH - 130, r2 = 52;
      sc.strokeStyle = `rgba(${ink},${light ? 0.35 : 0.28})`;
      sc.lineWidth = 1.2;
      sc.beginPath(); sc.arc(cx, cy, r2, 0, Math.PI * 2); sc.stroke();
      sc.strokeStyle = `rgba(${ink},0.15)`;
      sc.beginPath(); sc.moveTo(cx - r2 - 30, cy); sc.lineTo(SW - 40, cy); sc.stroke();

      const th = simT * 1.1;
      const dotX = cx + Math.cos(th) * r2, dotY = cy - Math.sin(th) * r2;
      const waveX0 = cx + r2 + 34, waveX1 = SW - 50, k = 0.028;
      sc.strokeStyle = accent;
      sc.globalAlpha = light ? 0.55 : 0.7;
      sc.lineWidth = 2;
      sc.shadowColor = accent;
      sc.shadowBlur = light ? 0 : 8;
      sc.beginPath();
      for (let x = waveX0; x <= waveX1; x += 3) {
        const y = cy - Math.sin(th - (x - waveX0) * k) * r2;
        x === waveX0 ? sc.moveTo(x, y) : sc.lineTo(x, y);
      }
      sc.stroke();
      sc.shadowBlur = 0; sc.globalAlpha = 1;

      sc.strokeStyle = `rgba(${ink},0.5)`;
      sc.lineWidth = 1;
      sc.beginPath(); sc.moveTo(cx, cy); sc.lineTo(dotX, dotY); sc.stroke();
      sc.setLineDash([4, 4]);
      sc.beginPath(); sc.moveTo(dotX, dotY); sc.lineTo(waveX0, cy - Math.sin(th) * r2); sc.stroke();
      sc.setLineDash([]);
      sc.fillStyle = accent;
      sc.beginPath(); sc.arc(dotX, dotY, 4, 0, Math.PI * 2); sc.fill();
      sc.beginPath(); sc.arc(waveX0, cy - Math.sin(th) * r2, 3, 0, Math.PI * 2); sc.fill();

      // drifting symbols
      sc.textAlign = 'center'; sc.textBaseline = 'middle';
      for (const g of mGlyphs) {
        g.y -= g.vy * dt;
        if (g.y < -40) { g.y = SH + 40; g.x = Math.random() * SW; }
        const a = (light ? 0.30 : 0.24) * (0.5 + 0.5 * Math.sin(simT * 0.8 + g.ph));
        sc.save();
        sc.translate(g.x, g.y);
        sc.rotate(Math.sin(simT * 0.3 + g.ph) * g.rot);
        sc.font = `${g.s}px 'Share Tech Mono', monospace`;
        sc.fillStyle = `rgba(${ink},${a})`;
        sc.fillText(g.g, 0, 0);
        sc.restore();
      }

      // famous identities fading in and out at the edges
      mEqTimer -= dt;
      if (mEqTimer <= 0 && mEqs.length < 2) {
        mEqs.push({
          text: MATH_EQS[Math.floor(Math.random() * MATH_EQS.length)],
          x: Math.random() < 0.5 ? SW * 0.16 : SW * 0.84,
          y: SH * (0.15 + Math.random() * 0.45),
          age: 0, life: 7
        });
        mEqTimer = 4 + Math.random() * 3;
      }
      sc.font = "17px 'Share Tech Mono', monospace";
      mEqs = mEqs.filter(q => {
        q.age += dt;
        if (q.age >= q.life) return false;
        const fade = Math.max(0, Math.min(q.age / 1.2, 1, (q.life - q.age) / 1.5));
        sc.fillStyle = `rgba(${ink},${fade * (light ? 0.55 : 0.5)})`;
        sc.fillText(q.text, q.x, q.y - q.age * 4);
        return true;
      });
    }

    function drawPlanet(light) {
      const pr = 30;
      const px = SW * 0.13, py = SH * 0.74 + Math.sin(simT * 0.1) * 6;
      const ringCol = light ? 'rgba(90,80,140,0.5)' : 'rgba(210,190,230,0.55)';
      sc.save();
      sc.translate(px, py);
      sc.rotate(-0.35);
      sc.strokeStyle = ringCol; sc.lineWidth = 3;
      sc.beginPath(); sc.ellipse(0, 0, pr * 1.9, pr * 0.55, 0, Math.PI, Math.PI * 2); sc.stroke();
      const g = sc.createRadialGradient(-pr * 0.4, -pr * 0.4, pr * 0.1, 0, 0, pr);
      if (light) { g.addColorStop(0, '#b9a6e8'); g.addColorStop(0.6, '#8a76c4'); g.addColorStop(1, '#4c3f78'); }
      else { g.addColorStop(0, '#d8b08a'); g.addColorStop(0.55, '#a2684c'); g.addColorStop(1, '#2a1420'); }
      sc.fillStyle = g;
      sc.beginPath(); sc.arc(0, 0, pr, 0, Math.PI * 2); sc.fill();
      // faint latitude bands
      sc.save();
      sc.beginPath(); sc.arc(0, 0, pr, 0, Math.PI * 2); sc.clip();
      sc.globalAlpha = 0.16;
      sc.strokeStyle = light ? '#3d3163' : '#5a2e22';
      sc.lineWidth = 2.5;
      for (const yy of [-0.45, -0.1, 0.3]) {
        sc.beginPath();
        sc.ellipse(0, pr * yy, pr, pr * 0.16, 0, 0, Math.PI * 2);
        sc.stroke();
      }
      sc.restore();
      sc.strokeStyle = ringCol; sc.lineWidth = 3;
      sc.beginPath(); sc.ellipse(0, 0, pr * 1.9, pr * 0.55, 0, 0, Math.PI); sc.stroke();
      sc.restore();
    }

    function drawUniverse(dt) {
      sc.clearRect(0, 0, SW, SH);
      const light = document.body.classList.contains('light');
      sc.globalCompositeOperation = light ? 'source-over' : 'lighter';

      // nebulae — slow drifting clouds of color
      for (const n of uNebulae) {
        n.x += n.dx * dt; n.y += n.dy * dt;
        if (n.x < -n.r) n.x = SW + n.r; else if (n.x > SW + n.r) n.x = -n.r;
        if (n.y < -n.r) n.y = SH + n.r; else if (n.y > SH + n.r) n.y = -n.r;
        const pulse = 0.75 + 0.25 * Math.sin(simT * 0.15 + n.ph);
        const rr = n.r * pulse;
        const g = sc.createRadialGradient(n.x, n.y, 0, n.x, n.y, rr);
        const A = light ? 0.10 : 0.085;
        g.addColorStop(0, `hsla(${n.hue},70%,${light ? 45 : 60}%,${A})`);
        g.addColorStop(0.5, `hsla(${n.hue},75%,${light ? 50 : 45}%,${A * 0.5})`);
        g.addColorStop(1, `hsla(${n.hue},80%,40%,0)`);
        sc.fillStyle = g;
        sc.fillRect(n.x - rr, n.y - rr, rr * 2, rr * 2);
      }

      // parallax starfield with twinkle
      const starCol = light ? '30,40,90' : '255,255,255';
      for (const s of uStars) {
        s.x -= s.spd * dt; s.y += s.spd * 0.3 * dt;
        if (s.x < -4) { s.x = SW + 4; s.y = Math.random() * SH; }
        if (s.y > SH + 4) s.y = -4;
        const tw = 0.55 + 0.45 * Math.sin(simT * s.fr + s.ph);
        sc.fillStyle = `rgba(${starCol},${(light ? 0.5 : 0.9) * tw * (0.35 + 0.25 * s.li)})`;
        sc.beginPath(); sc.arc(s.x, s.y, s.r, 0, Math.PI * 2); sc.fill();
        if (s.li === 2 && tw > 0.9) {
          sc.strokeStyle = `rgba(${starCol},${0.35 * tw})`;
          sc.lineWidth = 1;
          sc.beginPath();
          sc.moveTo(s.x - s.r * 3, s.y); sc.lineTo(s.x + s.r * 3, s.y);
          sc.moveTo(s.x, s.y - s.r * 3); sc.lineTo(s.x, s.y + s.r * 3);
          sc.stroke();
        }
      }

      // spiral galaxy — inner stars orbit faster than outer (differential rotation)
      const gx = SW * 0.8, gy = SH * 0.2;
      const cg = sc.createRadialGradient(gx, gy, 0, gx, gy, 60);
      cg.addColorStop(0, light ? 'rgba(90,70,160,0.35)' : 'rgba(255,240,220,0.5)');
      cg.addColorStop(1, 'rgba(255,240,220,0)');
      sc.fillStyle = cg;
      sc.fillRect(gx - 60, gy - 60, 120, 120);
      for (const p of uGalaxy) {
        const a = p.a0 + simT * 0.55 / Math.sqrt(p.r * 0.06 + 1);
        const x = gx + Math.cos(a) * p.r, y = gy + Math.sin(a) * p.r * 0.55;
        const col = p.warm ? (light ? '110,80,60' : '255,220,180') : (light ? '60,60,130' : '190,210,255');
        sc.fillStyle = `rgba(${col},${p.al * (light ? 0.7 : 1)})`;
        sc.beginPath(); sc.arc(x, y, p.s, 0, Math.PI * 2); sc.fill();
      }

      sc.globalCompositeOperation = 'source-over';
      drawPlanet(light);

      // meteors
      if (!light) sc.globalCompositeOperation = 'lighter';
      uMeteorTimer -= dt;
      if (uMeteorTimer <= 0) {
        const ang = Math.PI * (0.62 + Math.random() * 0.22);
        const sp = 420 + Math.random() * 260;
        uMeteors.push({
          x: SW * (0.25 + Math.random() * 0.7), y: SH * Math.random() * 0.3,
          vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp,
          age: 0, life: 0.9 + Math.random() * 0.6
        });
        uMeteorTimer = 4 + Math.random() * 6;
      }
      uMeteors = uMeteors.filter(m => {
        m.age += dt;
        if (m.age >= m.life) return false;
        m.x += m.vx * dt; m.y += m.vy * dt;
        const f = 1 - m.age / m.life;
        const tx = m.x - m.vx * 0.13, ty = m.y - m.vy * 0.13;
        const g = sc.createLinearGradient(m.x, m.y, tx, ty);
        const mc = light ? '50,60,120' : '255,255,255';
        g.addColorStop(0, `rgba(${mc},${0.9 * f})`);
        g.addColorStop(1, `rgba(${mc},0)`);
        sc.strokeStyle = g;
        sc.lineWidth = 2;
        sc.lineCap = 'round';
        sc.beginPath(); sc.moveTo(m.x, m.y); sc.lineTo(tx, ty); sc.stroke();
        return true;
      });
      sc.globalCompositeOperation = 'source-over';
    }

    function sceneFrame(ts) {
      const dt = Math.min((ts - lastFrameT) / 1000 || 0.016, 0.05);
      lastFrameT = ts;
      // scenes idle at a gentler pace while the timer is paused
      const sdt = dt * (state.running ? 1 : 0.45);
      simT += sdt;
      if (sceneName === 'math') drawMath(sdt);
      else if (sceneName === 'universe') drawUniverse(sdt);
      sceneRAF = requestAnimationFrame(sceneFrame);
    }

    function applyScene(name) {
      sceneName = name;
      document.body.classList.toggle('scene-math', name === 'math');
      document.body.classList.toggle('scene-universe', name === 'universe');
      document.querySelectorAll('.scene-btn').forEach(b => b.classList.toggle('active', b.dataset.scene === name));
      localStorage.setItem('scene', name);
      if (name === 'off') {
        if (sceneRAF) { cancelAnimationFrame(sceneRAF); sceneRAF = null; }
        sc.clearRect(0, 0, SW, SH);
        return;
      }
      sceneResize();
      if (!sceneRAF) {
        lastFrameT = performance.now();
        sceneRAF = requestAnimationFrame(sceneFrame);
      }
    }
    document.querySelectorAll('.scene-btn').forEach(b => b.addEventListener('click', () => applyScene(b.dataset.scene)));
    window.addEventListener('resize', () => { if (sceneName !== 'off') sceneResize(); });

    applyShape(state.shape);
    applyTheme();
    applyScene(sceneName);
    render();
  </script>
</body>
</html>
